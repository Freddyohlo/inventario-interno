<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Informe de actualizaciones · Inventario</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">
  <style>
    body {
      background-color: #f1f5f9;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    }

    .navbar-brand {
      font-weight: 700;
      letter-spacing: 0.3px;
    }

    /* ---------- Encabezado ---------- */
    .page-header {
      background: linear-gradient(135deg, #1e3a5f 0%, #2563eb 100%);
      color: white;
      padding: 2.5rem 0 2rem;
      margin-bottom: 2rem;
    }

    .page-header h1 {
      font-size: 1.85rem;
      font-weight: 700;
      margin-bottom: 0.4rem;
    }

    .page-header p {
      opacity: 0.8;
      font-size: 0.95rem;
      margin: 0;
    }

    .stats-bar {
      display: flex;
      gap: 1rem;
      margin-top: 1.25rem;
      flex-wrap: wrap;
    }

    .stat-item {
      background: rgba(255, 255, 255, 0.15);
      border-radius: 8px;
      padding: 0.5rem 1rem;
      font-size: 0.85rem;
      font-weight: 600;
      display: inline-flex;
      align-items: center;
      gap: 0.45rem;
    }

    .stat-item i {
      opacity: 0.85;
    }

    /* ---------- Timeline ---------- */
    .timeline {
      position: relative;
      padding-left: 2.5rem;
    }

    /* Linea vertical que conecta los hitos */
    .timeline::before {
      content: '';
      position: absolute;
      left: 0.72rem;
      top: 0.6rem;
      bottom: 0.6rem;
      width: 2px;
      background: linear-gradient(180deg, #2563eb 0%, #cbd5e1 100%);
      border-radius: 2px;
    }

    .timeline-item {
      position: relative;
      margin-bottom: 1.25rem;
    }

    .timeline-item:last-child {
      margin-bottom: 0;
    }

    /* Punto del hito */
    .timeline-dot {
      position: absolute;
      left: -2.5rem;
      top: 1.15rem;
      width: 1.5rem;
      height: 1.5rem;
      border-radius: 50%;
      background: white;
      border: 2px solid #2563eb;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.7rem;
      color: #2563eb;
      z-index: 1;
    }

    .timeline-item.is-latest .timeline-dot {
      background: #2563eb;
      color: white;
      box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.15);
    }

    .update-card {
      background: white;
      border-radius: 12px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
      padding: 1.1rem 1.35rem;
      transition: box-shadow 0.2s ease, transform 0.2s ease;
      border-left: 3px solid transparent;
    }

    .update-card:hover {
      box-shadow: 0 6px 18px rgba(0, 0, 0, 0.09);
      transform: translateX(3px);
    }

    .timeline-item.is-latest .update-card {
      border-left-color: #2563eb;
    }

    .update-head {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      flex-wrap: wrap;
      margin-bottom: 0.5rem;
    }

    .fecha-badge {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      background-color: #eff6ff;
      color: #1e40af;
      border: 1px solid #bfdbfe;
      border-radius: 6px;
      padding: 0.28rem 0.65rem;
      font-size: 0.82rem;
      font-weight: 700;
      letter-spacing: 0.3px;
    }

    .badge-reciente {
      display: inline-flex;
      align-items: center;
      gap: 0.3rem;
      background-color: #dcfce7;
      color: #15803d;
      border-radius: 20px;
      padding: 0.25rem 0.7rem;
      font-size: 0.72rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.4px;
    }

    .update-text {
      color: #4b5563;
      font-size: 0.92rem;
      line-height: 1.55;
      margin: 0;
      white-space: pre-line;
    }

    /* ---------- Estados ---------- */
    .state-box {
      text-align: center;
      padding: 3rem 1rem;
      color: #9ca3af;
    }

    .state-box i {
      font-size: 2.5rem;
      display: block;
      margin-bottom: 0.75rem;
      opacity: 0.6;
    }

    @media (max-width: 768px) {
      .page-header h1 {
        font-size: 1.4rem;
      }

      .timeline {
        padding-left: 2rem;
      }

      .timeline-dot {
        left: -2rem;
        width: 1.25rem;
        height: 1.25rem;
        font-size: 0.6rem;
      }

      .timeline::before {
        left: 0.58rem;
      }
    }
  </style>
</head>
<body>

  <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container-fluid">
      <a class="navbar-brand" href="/">Inventario</a>
      <div class="collapse navbar-collapse">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item">
            <a class="nav-link" href="/">Inicio</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="/admin" title="Panel de administración">
              <i class="bi bi-gear"></i>
            </a>
          </li>
        </ul>
      </div>
    </div>
  </nav>

  <header class="page-header">
    <div class="container">
      <h1><i class="bi bi-clock-history me-2"></i>Informe de actualizaciones</h1>
      <p>Historial de cambios del inventario de equipos de radiofrecuencia</p>
      <div class="stats-bar" id="statsBar"></div>
    </div>
  </header>

  <main class="container pb-5">
    <div id="updatesContainer">
      <div class="state-box">
        <i class="bi bi-hourglass-split"></i>
        Cargando historial…
      </div>
    </div>
  </main>

  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script>
    // El historial viene de Supabase (tabla `actualizaciones`), asi que se
    // mantiene sincronizado con lo que se edita en el panel.
    function formatearFecha(iso) {
      if (!iso) return '';
      const [y, m, d] = iso.slice(0, 10).split('-');
      return `${d}-${m}-${y}`;
    }

    function mesAnio(iso) {
      const meses = ['enero', 'febrero', 'marzo', 'abril', 'mayo', 'junio', 'julio',
                     'agosto', 'septiembre', 'octubre', 'noviembre', 'diciembre'];
      const [y, m] = iso.slice(0, 10).split('-');
      return `${meses[Number(m) - 1]} ${y}`;
    }

    function escapar(texto) {
      return (texto || '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;');
    }

    function pintar(filas) {
      const cont = document.getElementById('updatesContainer');
      const stats = document.getElementById('statsBar');

      if (!filas.length) {
        stats.innerHTML = '';
        cont.innerHTML = `
          <div class="state-box">
            <i class="bi bi-inbox"></i>
            Sin actualizaciones registradas.
          </div>`;
        return;
      }

      // Barra de resumen en el encabezado
      stats.innerHTML = `
        <span class="stat-item"><i class="bi bi-list-check"></i>${filas.length} actualizaciones</span>
        <span class="stat-item"><i class="bi bi-calendar-check"></i>Última: ${formatearFecha(filas[0].fecha)}</span>
        <span class="stat-item"><i class="bi bi-calendar3"></i>Desde ${mesAnio(filas[filas.length - 1].fecha)}</span>`;

      cont.innerHTML = `<div class="timeline">${filas
        .map(
          (f, i) => `
        <div class="timeline-item${i === 0 ? ' is-latest' : ''}">
          <div class="timeline-dot"><i class="bi bi-${i === 0 ? 'star-fill' : 'dot'}"></i></div>
          <div class="update-card">
            <div class="update-head">
              <span class="fecha-badge"><i class="bi bi-calendar-event"></i>${formatearFecha(f.fecha)}</span>
              ${i === 0 ? '<span class="badge-reciente"><i class="bi bi-lightning-charge-fill"></i>Más reciente</span>' : ''}
            </div>
            <p class="update-text">${escapar(f.leyenda)}</p>
          </div>
        </div>`
        )
        .join('')}</div>`;
    }

    (async function cargar() {
      const cont = document.getElementById('updatesContainer');
      try {
        if (!window.InventarioAPI || !window.InventarioAPI.configurado) {
          cont.innerHTML = `<div class="state-box"><i class="bi bi-wifi-off"></i>Historial no disponible.</div>`;
          return;
        }
        const filas = (await window.InventarioAPI.actualizaciones()) || [];
        pintar(filas);
      } catch (e) {
        cont.innerHTML = `<div class="state-box"><i class="bi bi-exclamation-triangle"></i>No se pudo cargar el historial.</div>`;
      }
    })();
  </script>

</body>
</html>
