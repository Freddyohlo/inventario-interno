<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Levantamiento de Inventario</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">
  <style>
    body {
      background-color: #f8f9fa;
    }
    /* Tarjetas */
    .card {
      border-radius: 1rem;
      box-shadow: 0 4px 8px rgba(0,0,0,0.05);
      transition: transform 0.3s ease, box-shadow 0.3s ease;
    }
    .card:hover {
      transform: scale(1.08) translateY(-8px);
      box-shadow: 0 12px 28px rgba(0,0,0,0.25);
      z-index: 5;
    }
    .card-title {
      font-size: 1rem;
      font-weight: 600;
    }
    /* Estilos Navbar */
    .navbar {
      margin-bottom: 20px;
    }
    /* Estilo del título principal */
    .page-title {
      text-align: center;
      font-size: 2rem;
      font-weight: 700;
      color: #343a40;
      margin-bottom: 30px;
      border-bottom: 3px solid #0d6efd;
      display: inline-block;
      padding-bottom: 8px;
    }
  </style>
</head>
<body>

  <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container-fluid">
      <a class="navbar-brand" href="/">Inventario</a>
      <div class="collapse navbar-collapse">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item">
            <a class="nav-link" href="/">Inicio</a>
          </li>
            <li class="nav-item">
              <a class="nav-link" href="/admin" title="Panel de administración">
                <i class="bi bi-gear"></i>
              </a>
            </li>
        </ul>
      </div>
    </div>
  </nav>

  <main class="container">
    <h1 class="page-title">Informe de actualizaciones</h1>
    <div class="row g-3 mt-4" id="updatesContainer">
      <div class="col-12 text-center text-muted py-4" id="cargando">Cargando historial...</div>
    </div>
  </main>

  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script>
    // El historial viene de Supabase (tabla `actualizaciones`), asi que se
    // mantiene sincronizado con lo que se edita en el panel.
    function formatearFecha(iso) {
      if (!iso) return '';
      const [y, m, d] = iso.slice(0, 10).split('-');
      return `${d}-${m}-${y}`;
    }

    function pintar(filas) {
      const cont = document.getElementById('updatesContainer');
      if (!filas.length) {
        cont.innerHTML = '<div class="col-12 text-center text-muted py-4">Sin actualizaciones registradas.</div>';
        return;
      }
      cont.innerHTML = filas
        .map(
          (f) => `
        <div class="col-md-6">
          <div class="card p-3 text-center">
            <h6 class="card-title">Actualización ${formatearFecha(f.fecha)}</h6>
            <p class="mb-0" style="white-space: pre-line;">${(f.leyenda || '').replace(/</g, '&lt;')}</p>
          </div>
        </div>`
        )
        .join('');
    }

    (async function cargar() {
      try {
        if (!window.InventarioAPI || !window.InventarioAPI.configurado) {
          document.getElementById('updatesContainer').innerHTML =
            '<div class="col-12 text-center text-muted py-4">Historial no disponible.</div>';
          return;
        }
        const filas = (await window.InventarioAPI.actualizaciones()) || [];
        pintar(filas);
      } catch (e) {
        document.getElementById('updatesContainer').innerHTML =
          '<div class="col-12 text-center text-muted py-4">No se pudo cargar el historial.</div>';
      }
    })();
  </script>

</body>
</html>
