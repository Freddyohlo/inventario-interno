<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Guía de Pasos</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">
  <link href="pasos.css" rel="stylesheet">
</head>
<body>
  <div class="container py-5">
    <div class="mb-4">
      <a href="index.html" class="text-decoration-none text-muted">
        <i class="bi bi-arrow-left"></i> Volver
      </a>
    </div>

    <div class="progress mb-4" style="height: 6px;">
      <div class="progress-bar" id="progressBar" role="progressbar" style="width: 8.33%;"></div>
    </div>

    <div class="d-flex justify-content-between align-items-center mb-5">
      <div>
        <h2 class="fw-bold" id="moduleTitle">Configuración de TRF</h2>
        <p class="text-muted mb-0" id="stepTitle">Paso 1 de 10</p>
      </div>
      <span class="badge rounded-pill" id="phaseBadge">Preparación</span>
    </div>

    <div class="row g-4">
      <div class="col-lg-6">
        <div class="card border-0 shadow-sm h-100">
          <div class="card-body p-5 text-center d-flex flex-column justify-content-center">
            <div class="avatar-circle mb-4 mx-auto" id="avatarCircle">
              <i class="bi bi-gear-fill text-white" style="font-size: 3rem;"></i>
            </div>
            <h5 class="card-title mb-3" id="stepName">Cargando...</h5>
            <p class="text-muted mb-0" id="stepDescription">Descripción del paso</p>
          </div>
        </div>
      </div>

      <div class="col-lg-6">
        <div class="card border-0 shadow-sm h-100">
          <div class="card-body p-4 d-flex align-items-center justify-content-center">
            <div class="image-container text-center w-100">
              <img id="stepImage" src="" alt="Paso" class="img-fluid rounded shadow-sm" style="max-height: 400px; object-fit: contain;">
            </div>
          </div>
        </div>
      </div>
    </div>

    <div class="d-flex justify-content-between align-items-center mt-5">
      <button class="btn btn-outline-secondary px-4" id="prevBtn" onclick="previousStep()">
        <i class="bi bi-chevron-left"></i> Anterior
      </button>

      <div class="text-center">
      <span class="text-muted" id="stepCounter">Paso <span id="currentStep">1</span> de <span id="totalStepsDisplay">10</span></span>
      </div>

      <button class="btn btn-primary px-4" id="nextBtn" onclick="nextStep()">
        Siguiente <i class="bi bi-chevron-right"></i>
      </button>
    </div>
  </div>

  <script src="pasos.js"></script>
</body>
</html>
