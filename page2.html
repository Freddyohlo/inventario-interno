<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Equipos en detalle · Inventario</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">
  <style>
    body {
      background-color: #f1f5f9;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    }

    .navbar-brand { font-weight: 700; letter-spacing: 0.3px; }

    /* ---------- Encabezado ---------- */
    .page-header {
      background: linear-gradient(135deg, #1e3a5f 0%, #2563eb 100%);
      color: white;
      padding: 2.5rem 0 2rem;
      margin-bottom: 2rem;
    }

    .page-header h1 { font-size: 1.85rem; font-weight: 700; margin-bottom: 0.4rem; }
    .page-header p { opacity: 0.8; font-size: 0.95rem; margin: 0; }

    .stats-bar { display: flex; gap: 1rem; margin-top: 1.25rem; flex-wrap: wrap; }

    .stat-item {
      background: rgba(255, 255, 255, 0.15);
      border-radius: 8px;
      padding: 0.5rem 1rem;
      font-size: 0.85rem;
      font-weight: 600;
      display: inline-flex;
      align-items: center;
      gap: 0.45rem;
    }

    /* ---------- Tarjetas de equipo ---------- */
    .equipo-card {
      background: white;
      border-radius: 12px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
      overflow: hidden;
      height: 100%;
      display: flex;
      flex-direction: column;
      transition: box-shadow 0.2s ease, transform 0.2s ease;
    }

    .equipo-card:hover {
      box-shadow: 0 8px 22px rgba(0, 0, 0, 0.1);
      transform: translateY(-3px);
    }

    .equipo-foto {
      width: 100%;
      height: 190px;
      object-fit: cover;
      background: #eef2f7;
      display: block;
    }

    .equipo-foto-vacia {
      height: 190px;
      background: #eef2f7;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #9ca3af;
      font-size: 2rem;
    }

    .equipo-body { padding: 1rem 1.15rem 1.15rem; display: flex; flex-direction: column; gap: 0.45rem; flex: 1; }

    .equipo-codigo {
      display: inline-block;
      align-self: flex-start;
      padding: 0.28rem 0.7rem;
      border-radius: 6px;
      font-size: 0.8rem;
      font-weight: 700;
      letter-spacing: 0.3px;
    }

    .tipo-laboratorio .equipo-codigo {
      background-color: #eff6ff;
      color: #1e40af;
      border: 1px solid #bfdbfe;
    }

    .tipo-detalle .equipo-codigo {
      background-color: #fffbeb;
      color: #b45309;
      border: 1px solid #fde68a;
    }

    .equipo-nombre { font-size: 1rem; font-weight: 700; color: #172b4d; margin: 0; }
    .equipo-desc { font-size: 0.88rem; color: #4b5563; line-height: 1.5; margin: 0; }

    .estado-badge {
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
      align-self: flex-start;
      border-radius: 20px;
      padding: 0.25rem 0.7rem;
      font-size: 0.72rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.4px;
      margin-top: auto;
    }

    .tipo-laboratorio .estado-badge { background-color: #fef2f2; color: #b91c1c; }
    .tipo-detalle .estado-badge { background-color: #f0fdf4; color: #15803d; }

    /* ---------- Estados ---------- */
    .state-box { text-align: center; padding: 3rem 1rem; color: #9ca3af; }
    .state-box i { font-size: 2.5rem; display: block; margin-bottom: 0.75rem; opacity: 0.6; }

    @media (max-width: 768px) {
      .page-header h1 { font-size: 1.4rem; }
      .equipo-foto, .equipo-foto-vacia { height: 160px; }
    }
  </style>
</head>
<body>

  <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container-fluid">
      <a class="navbar-brand" href="/">Inventario</a>
      <div class="collapse navbar-collapse">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item"><a class="nav-link" href="/">Inicio</a></li>
          <li class="nav-item">
            <a class="nav-link" href="/admin" title="Panel de administración"><i class="bi bi-gear"></i></a>
          </li>
        </ul>
      </div>
    </div>
  </nav>

  <header class="page-header">
    <div class="container">
      <h1 id="titulo"><i class="bi bi-camera me-2"></i>Cargando…</h1>
      <p id="subtitulo"></p>
      <div class="stats-bar" id="statsBar"></div>
    </div>
  </header>

  <main class="container pb-5">
    <div id="contenedor">
      <div class="state-box">
        <i class="bi bi-hourglass-split"></i>
        Cargando equipos…
      </div>
    </div>
  </main>

  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script>
    // Los equipos vienen de Supabase (tabla `equipos_detalle`), asi que reflejan
    // lo que se carga en el panel. El tipo se elige con ?tipo=laboratorio|detalle.
    const TEXTOS = {
      laboratorio: {
        titulo: 'Equipos en laboratorio para mantención',
        subtitulo: 'Equipos que deben ir a servicio técnico para ser reparados',
        estado: 'Fuera de operación',
      },
      detalle: {
        titulo: 'Equipos con detalles sin problemas de funcionamiento',
        subtitulo: 'Equipos que operan normalmente, pero tienen un desperfecto',
        estado: 'Opera con detalle',
      },
    };

    function escapar(t) {
      return (t || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    }

    function pintar(tipo, filas) {
      const cont = document.getElementById('contenedor');
      const info = TEXTOS[tipo];

      document.getElementById('titulo').innerHTML = `<i class="bi bi-camera me-2"></i>${info.titulo}`;
      document.getElementById('subtitulo').textContent = info.subtitulo;
      document.getElementById('statsBar').innerHTML = `
        <span class="stat-item"><i class="bi bi-list-check"></i>${filas.length} equipo(s)</span>
        <span class="stat-item"><i class="bi bi-info-circle"></i>${info.estado}</span>`;

      if (!filas.length) {
        cont.innerHTML = `<div class="state-box"><i class="bi bi-inbox"></i>Sin equipos registrados.</div>`;
        return;
      }

      cont.innerHTML = `<div class="row g-3">${filas
        .map(
          (f) => `
        <div class="col-md-6 col-lg-4">
          <div class="equipo-card tipo-${tipo}">
            ${
              f.foto_url
                ? `<img class="equipo-foto" src="${window.InventarioAPI.urlFoto(f.foto_url)}" alt="${escapar(f.nombre)}" loading="lazy">`
                : `<div class="equipo-foto-vacia"><i class="bi bi-camera"></i></div>`
            }
            <div class="equipo-body">
              <span class="equipo-codigo">${escapar(f.codigo)}</span>
              <p class="equipo-nombre">${escapar(f.nombre)}</p>
              <p class="equipo-desc">${escapar(f.descripcion)}</p>
              <span class="estado-badge">
                <i class="bi bi-${tipo === 'laboratorio' ? 'tools' : 'exclamation-circle'}"></i>${info.estado}
              </span>
            </div>
          </div>
        </div>`
        )
        .join('')}</div>`;
    }

    (async function cargar() {
      const cont = document.getElementById('contenedor');
      const params = new URLSearchParams(location.search);
      const tipo = params.get('tipo') === 'laboratorio' ? 'laboratorio' : 'detalle';

      try {
        if (!window.InventarioAPI || !window.InventarioAPI.configurado) {
          cont.innerHTML = `<div class="state-box"><i class="bi bi-wifi-off"></i>Información no disponible.</div>`;
          return;
        }
        const filas = (await window.InventarioAPI.equiposDetalle(tipo)) || [];
        pintar(tipo, filas);
      } catch (e) {
        cont.innerHTML = `<div class="state-box"><i class="bi bi-exclamation-triangle"></i>No se pudieron cargar los equipos.</div>`;
      }
    })();
  </script>

</body>
</html>
