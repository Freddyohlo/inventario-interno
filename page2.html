<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Levantamiento de Inventario</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css"
      rel="stylesheet"
    />
    <style>
      body {
        background-color: #f8f9fa;
      }
      .card {
        border-radius: 1rem;
        box-shadow: 0 4px 8px rgba(0, 0, 0, 0.05);
        transition: transform 0.3s ease, box-shadow 0.3s ease;
      }
      .card:hover {
        transform: scale(1.08) translateY(-8px);
        box-shadow: 0 12px 28px rgba(0, 0, 0, 0.25);
        z-index: 5;
      }
      .card-title {
        font-size: 1rem;
        font-weight: 600;
      }
      .page-title {
        text-align: center;
        font-size: 2rem;
        font-weight: 700;
        color: #343a40;
        margin-bottom: 30px;
        border-bottom: 3px solid #0d6efd;
        display: inline-block;
        padding-bottom: 8px;
      }
    </style>
  </head>
  <body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
      <div class="container-fluid">
        <a class="navbar-brand" href="/">Inventario</a>
        <div class="collapse navbar-collapse">
          <ul class="navbar-nav ms-auto">
            <li class="nav-item">
              <a class="nav-link" href="/">Inicio</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="/admin" title="Panel de administración">
                <i class="bi bi-gear"></i>
              </a>
            </li>
          </ul>
        </div>
      </div>
    </nav>

    <main class="container py-4">
      <section id="detalle-section" style="display: none">
        <h1 class="page-title">
          Equipos con detalles sin problemas de funcionamiento
        </h1>
        <div class="row g-3 mt-4">
          <div class="col-md-6">
            <div class="card p-3 text-center">
              <img
                src="Image/Cel003.jpg"
                class="mx-auto mb-2"
                alt="Baliza"
                style="width: 120px; height: 120px; object-fit: contain"
              />
              <h6 class="card-title">Celular Android</h6>
              <h3 class="text-danger">Cel003</h3>
              <p class="mb-0">Pantalla trizada</p>
            </div>
          </div>
        </div>
      </section>

      <section id="laboratorio-section" style="display: none">
        <h1 class="page-title">Equipos en laboratorio para mantención</h1>
        <div class="row g-3 mt-4"></div>
      </section>
    </main>

    <script>
      document.addEventListener('DOMContentLoaded', () => {
        const urlParams = new URLSearchParams(window.location.search);
        const tipo = urlParams.get('tipo');

        const detalleSection = document.getElementById('detalle-section');
        const laboratorioSection = document.getElementById(
          'laboratorio-section'
        );

        if (tipo === 'detalle') {
          detalleSection.style.display = 'block';
          laboratorioSection.style.display = 'none';
        } else if (tipo === 'laboratorio') {
          detalleSection.style.display = 'none';
          laboratorioSection.style.display = 'block';
        } else {
          // Comportamiento por defecto, mostrar ambos si se accede directamente a la página
          detalleSection.style.display = 'block';
          laboratorioSection.style.display = 'block';
        }
      });
    </script>
  </body>
</html>
