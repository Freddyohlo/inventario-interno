<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Levantamiento de Inventario</title>
  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Chart.js (si lo usas en esta página) -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <!-- Iconos de Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">
  <style>
    body {
      background-color: #f8f9fa;
    }

    /* Tarjetas (mantuve tu efecto) */
    .card {
      border-radius: 1rem;
      box-shadow: 0 4px 8px rgba(0,0,0,0.05);
      transition: transform 0.3s ease, box-shadow 0.3s ease;
    }

    .card:hover {
      transform: scale(1.08) translateY(-8px);
      box-shadow: 0 12px 28px rgba(0,0,0,0.25);
      z-index: 5;
    }

    .card-title {
      font-size: 1rem;
      font-weight: 600;
    }

    /* Estilo del título principal */
    .page-title {
      text-align: center;
      font-size: 2rem;
      font-weight: 700;
      color: #343a40;
      margin-bottom: 30px;
      border-bottom: 3px solid #0d6efd;
      display: inline-block;
      padding-bottom: 8px;
    }
  </style>
</head>
<body>

  <!-- Navbar (tuya, la dejé) -->
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container-fluid">
      <a class="navbar-brand" href="/">Inventario</a>
      <div class="collapse navbar-collapse">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item">
            <a class="nav-link" href="/">Inicio</a>
        </ul>
      </div>
    </div>
  </nav>

  <!-- Contenido principal: cada sección incluye su título -->
  <main class="container py-4">

    <!-- Sección: Equipos con detalle -->
    <section id="detalle" style="display:none;">
      <h1 class="page-title">Equipos con detalles sin problemas de funcionamiento</h1>
      <div class="row g-3 mt-4">
        <div class="col-md-6">
          <div class="card p-3 text-center">
            <img src="Image/T47.jpg" class="mx-auto mb-2" alt="Zebra 330L" style="width: 120px; height: 120px; object-fit: contain;">
            <h6 class="card-title">TRF Zebra 330L</h6>
            <h3 class="text-success">T47</h3>
            <p class="mb-0">Pantalla trizada</p>
          </div>
        </div>

        <div class="col-md-6">
          <div class="card p-3 text-center">
            <img src="Image/Cel003.jpg" class="mx-auto mb-2" alt="Baliza" style="width: 120px; height: 120px; object-fit: contain;">
            <h6 class="card-title">Celular Android</h6>
            <h3 class="text-danger">Cel003</h3>
            <p class="mb-0">Pantalla trizada</p>
          </div>
        </div>
      </div>
    </section>

    <!-- Sección: Equipos en laboratorio -->
    <section id="laboratorio" style="display:none;">
    </section>

  </main>

  <script>
    // Leer parámetro "tipo" de la URL
    const params = new URLSearchParams(window.location.search);
    const tipo = params.get("tipo");

    const detalle = document.getElementById("detalle");
    const laboratorio = document.getElementById("laboratorio");

    // Oculto todo y muestro sólo lo solicitado
    detalle.style.display = "none";
    laboratorio.style.display = "none";

    if (tipo === "detalle") {
      detalle.style.display = "block";
    } else if (tipo === "laboratorio") {
      laboratorio.style.display = "block";
    } else {
      // Si no hay parámetro, muestro ambas (comportamiento original)
      detalle.style.display = "block";
      laboratorio.style.display = "block";
    }
  </script>
</body>
</html>
